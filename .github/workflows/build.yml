name: Build ScreenScribe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run core checks
        run: swift run ScreenScribeCoreChecks

      - name: Build arm64 app without Developer ID
        run: |
          xcodebuild \
            -project ScreenScribe.xcodeproj \
            -scheme ScreenScribe \
            -configuration Release \
            -derivedDataPath DerivedData \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign and package
        run: |
          codesign --force --deep --sign - 'DerivedData/Build/Products/Release/幕语.app'
          ditto -c -k --sequesterRsrc --keepParent \
            'DerivedData/Build/Products/Release/幕语.app' \
            ScreenScribe.app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScribe-arm64
          path: ScreenScribe.app.zip
          if-no-files-found: error

