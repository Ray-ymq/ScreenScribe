name: ScreenScribe
options:
  bundleIdPrefix: com.ray
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
targets:
  ScreenScribe:
    type: application
    platform: macOS
    sources:
      - path: ScreenScribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ray.ScreenScribe
        PRODUCT_NAME: 幕语
        PRODUCT_MODULE_NAME: ScreenScribe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 幕语
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: 幕语需要读取所选屏幕、窗口或应用的系统音频以生成本地文稿，不会保存视频画面。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
    entitlements:
      path: ScreenScribe/ScreenScribe.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - package: WhisperKit
        product: WhisperKit
  ScreenScribeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ScreenScribeCoreTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/幕语.app/Contents/MacOS/幕语"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: ScreenScribe
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.0.0
schemes:
  ScreenScribe:
    build:
      targets:
        ScreenScribe: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: ScreenScribeTests
